global:
  scrape_interval: 15s      # 默认抓取间隔
  evaluation_interval: 15s  # 告警规则评估间隔

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fastapi-app'
    static_configs:
      - targets: ['fastapi-app:8000']   # 通过 Docker monitoring 网络访问 FastAPI 容器
    metrics_path: '/metrics'
    scrape_interval: 5s
